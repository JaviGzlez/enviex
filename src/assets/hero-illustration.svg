<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d3050" />
      <stop offset="1" stop-color="#092640" />
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="800" height="400" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="400" fill="url(#bg)" />

    <!-- Circulos decorativos -->
    <circle cx="700" cy="30" r="150" fill="#ffffff" opacity="0.04" />
    <circle cx="60" cy="380" r="130" fill="#e50914" opacity="0.08" />

    <!-- Ruta de puntos -->
    <path d="M 60 280 C 220 200, 320 340, 480 240 S 700 140, 740 90"
          fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"
          stroke-dasharray="2 14" stroke-linecap="round" />

    <!-- Pin de origen -->
    <g transform="translate(60,280)">
      <circle r="7" fill="#ffffff" />
      <circle r="7" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="10" />
    </g>

    <!-- Pin de destino -->
    <g transform="translate(740,90)">
      <path d="M0 -26c11 0 20 9 20 20 0 15-20 34-20 34S-20 9-20-6c0-11 9-20 20-20z" fill="#e50914" />
      <circle cy="-6" r="8" fill="#ffffff" />
    </g>

    <!-- Tarjeta central: paquete -->
    <g transform="translate(400,205)">
      <rect x="-120" y="-95" width="240" height="190" rx="24" fill="#ffffff" opacity="0.06" />

      <!-- Caja 3D -->
      <g transform="translate(0,10)">
        <polygon points="-70,-10 0,-45 70,-10 0,25" fill="#f6f8fb" />
        <polygon points="-70,-10 0,25 0,90 -70,55" fill="#e7ecf3" />
        <polygon points="70,-10 0,25 0,90 70,55" fill="#ffffff" />
        <polygon points="-70,-10 0,-45 0,10 -70,45" fill="#092640" opacity="0.08" />
        <rect x="-6" y="18" width="12" height="72" fill="#e50914" />
        <polygon points="-70,10 0,45 0,58 -70,23" fill="#e50914" opacity="0.9" />
        <polygon points="70,10 0,45 0,58 70,23" fill="#c81022" opacity="0.85" />
      </g>
    </g>

    <!-- Texto EX sutil -->
    <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff" opacity="0.5" letter-spacing="6">
      ENVIEX
    </text>
  </g>
</svg>
