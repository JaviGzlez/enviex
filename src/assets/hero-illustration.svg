<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="600" height="460" rx="32" />
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="600" height="460" fill="#092640" />
    <circle cx="520" cy="60" r="140" fill="#0d3050" />
    <circle cx="40" cy="420" r="160" fill="#0d3050" />

    <!-- Ciudad -->
    <g opacity="0.5">
      <rect x="0" y="300" width="60" height="120" fill="#123a5e" />
      <rect x="70" y="260" width="50" height="160" fill="#123a5e" />
      <rect x="480" y="270" width="55" height="150" fill="#123a5e" />
      <rect x="545" y="230" width="55" height="190" fill="#123a5e" />
    </g>

    <!-- Carretera -->
    <rect x="0" y="400" width="600" height="60" fill="#06192d" />
    <g stroke="#f6f8fb" stroke-width="6" stroke-dasharray="24 18" opacity="0.35">
      <line x1="0" y1="430" x2="600" y2="430" />
    </g>

    <!-- Furgoneta -->
    <g transform="translate(150,250)">
      <rect x="0" y="40" width="220" height="90" rx="14" fill="#f6f8fb" />
      <rect x="0" y="0" width="140" height="60" rx="14" fill="#f6f8fb" />
      <rect x="14" y="14" width="70" height="34" rx="6" fill="#092640" opacity="0.15" />
      <rect x="0" y="60" width="140" height="8" fill="#e5e9f0" />
      <rect x="150" y="55" width="60" height="45" rx="8" fill="#e50914" />
      <text x="180" y="83" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#f6f8fb" text-anchor="middle">EX</text>
      <circle cx="45" cy="132" r="24" fill="#06192d" />
      <circle cx="45" cy="132" r="10" fill="#c7d2e0" />
      <circle cx="175" cy="132" r="24" fill="#06192d" />
      <circle cx="175" cy="132" r="10" fill="#c7d2e0" />
    </g>

    <!-- Paquete flotando -->
    <g transform="translate(90,150) rotate(-8)">
      <rect x="0" y="0" width="70" height="70" rx="10" fill="#f6f8fb" />
      <rect x="0" y="30" width="70" height="10" fill="#e50914" />
      <rect x="30" y="0" width="10" height="70" fill="#e50914" />
    </g>

    <!-- Paquete flotando 2 -->
    <g transform="translate(430,160) rotate(10)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#f6f8fb" />
      <rect x="0" y="24" width="56" height="8" fill="#092640" opacity="0.5" />
      <rect x="24" y="0" width="8" height="56" fill="#092640" opacity="0.5" />
    </g>

    <!-- Reloj / rapidez -->
    <g transform="translate(470,60)">
      <circle cx="0" cy="0" r="34" fill="#f6f8fb" opacity="0.9" />
      <circle cx="0" cy="0" r="34" fill="none" stroke="#e50914" stroke-width="4" />
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#092640" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="0" x2="14" y2="6" stroke="#092640" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
